name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      
      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1
        with: 
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/aws
            git pull
            sudo docker compose down
            sudo docker compose up -d --build
